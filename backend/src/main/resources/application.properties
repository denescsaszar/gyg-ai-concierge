spring.application.name=gyg-ai-concierge
app.version=0.0.1-SNAPSHOT
anthropic.api.key=${ANTHROPIC_API_KEY:}

# --- Cold start ---------------------------------------------------------
# On Render's free tier the service sleeps after 15 minutes and every wake-up
# is a full JVM + Spring context boot. These settings shave that down.

# Skip Spring's startup banner and the JMX registry we never query.
spring.main.banner-mode=off
spring.jmx.enabled=false

# Bind the port (which is what Render watches for "service is up") before
# building beans that may never be touched on a given request.
spring.main.lazy-initialization=true

# --- Response size ------------------------------------------------------
# The catalog is chatty JSON that gzips to a fraction of its size.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# --- Runtime ------------------------------------------------------------
# One free instance, low concurrency: a smaller thread pool means less memory
# pressure inside the 512MB limit.
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=4
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Do not leak stack traces to the browser.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Concierge limits ---------------------------------------------------
# Guardrails on the one endpoint that costs real money per call.
concierge.max-message-length=1000
concierge.max-history-messages=12
concierge.rate-limit.requests-per-window=10
concierge.rate-limit.window-seconds=60
